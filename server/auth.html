<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casa Luma · כניסה לצוות</title><style>body{margin:0;background:#F9EDE8;color:#333;font:16px/1.6 Arial,sans-serif;display:grid;min-height:100vh;place-items:center}main{width:min(380px,85vw);padding:35px;background:#fffdf9;border:1px solid #dfbc69;border-radius:16px}.brand{letter-spacing:5px;direction:ltr;text-align:center;font-size:25px}h1{font-size:25px;margin-bottom:8px}p{font-size:13px;color:#736d66}label{display:block;margin:16px 0;font-size:13px}input{display:block;box-sizing:border-box;width:100%;padding:12px;border:1px solid #d7cebf;border-radius:7px;font:inherit;margin-top:5px}button{background:#333;color:white;border:0;border-radius:7px;padding:13px;width:100%;font:inherit;cursor:pointer}button:disabled{opacity:.5}#error{color:#993c24;white-space:pre-line}a{color:#73591f;font-size:13px}</style></head><body><main><div class="brand">CASA LUMA</div><p>BUYING STUDIO · צוות בלבד</p><h1 id="title">כניסה למערכת</h1><p id="help">סל משותף, הזמנות וספקים במקום אחד.</p><form id="auth-form"><label id="setup-field" hidden>קוד הקמה מסביבת האחסון<input id="setup-token" type="password" autocomplete="off"></label><label id="name-field" hidden>שם מלא<input id="name" autocomplete="name" maxlength="200"></label><label id="email-field">אימייל<input id="email" type="email" autocomplete="username" required></label><label>סיסמה<input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="256"></label><p id="error" role="alert"></p><button id="submit">כניסה</button></form><p><a href="/login">כניסה / Sign in</a> · <a href="/setup">הקמה ראשונית לבעלים</a></p></main><script>
'use strict';const $=id=>document.getElementById(id),mode=location.pathname==='/setup'?'setup':location.pathname==='/join'?'join':'login',token=location.hash.slice(1);if(mode!=='login'){$('name-field').hidden=false;$('password').autocomplete='new-password';$('title').textContent=mode==='setup'?'פתיחת חשבון בעלים':'פתיחת חשבון עובד';$('submit').textContent='יצירת חשבון וכניסה';$('help').textContent='בחר סיסמה אישית של 12 תווים לפחות. אין לשלוח סיסמאות בצ׳אט.';}if(mode==='setup'){$('setup-field').hidden=false;$('setup-token').required=true;}if(mode==='join'){$('email-field').hidden=true;$('email').required=false;if(!token){$('error').textContent='קישור ההזמנה חסר. בקש קישור חדש מהבעלים.';$('submit').disabled=true;}}
$('auth-form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('error').textContent='';try{const r=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value,name:$('name').value,setupToken:$('setup-token').value,token})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Sign in failed');location.replace('/');}catch(e){$('error').textContent=e.message;$('submit').disabled=false;}});
</script></body></html>
